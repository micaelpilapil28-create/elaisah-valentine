<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>for u &lt;3</title>

    <style>

        body { background-color: #ffe6ea; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; font-family: sans-serif; overflow: hidden; text-transform: lowercase; touch-action: manipulation; }

        #card { background: white; width: 85%; max-width: 500px; padding: 50px 20px; border-radius: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); text-align: center; position: relative; z-index: 10; }

        h1 { color: #d63384; font-size: 1.8rem; margin-bottom: 40px; padding: 0 10px; }

        .btn-container { display: flex; justify-content: center; align-items: center; gap: 20px; min-height: 100px; flex-wrap: wrap; }

        .btn { padding: 15px 35px; font-size: 1.2rem; border: none; border-radius: 60px; cursor: pointer; font-weight: bold; display: inline-block; -webkit-tap-highlight-color: transparent; }

        #yes-btn { background-color: #20c997; color: white; }

        #no-btn { background-color: #dc3545; color: white; transition: left 2.5s ease-out, top 2.5s ease-out; position: relative; z-index: 100; }

        #reset-btn { background-color: #6c757d; color: white; margin-top: 20px; }

        .hidden { display: none; }

        .from-don { position: fixed; bottom: 20px; right: 20px; color: #d63384; font-weight: bold; font-size: 0.9rem; z-index: 5; }

        .emoji { font-size: 4rem; margin-bottom: 20px; display: block; }

    </style>

</head>

<body>



    <div id="card">

        <div id="q-section">

            <h1>elaisah will you be my valentine?</h1>

            <div class="btn-container">

                <button id="yes-btn" class="btn" onclick="showPage('yay')">yes</button>

                <button id="no-btn" class="btn" onmouseover="moveNo()" ontouchstart="moveNo()" onclick="showPage('aww')">no</button>

            </div>

        </div>



        <div id="yay-section" class="hidden">

            <span class="emoji">❤️</span>

            <h1>thaaaaank you!!!!</h1>

        </div>



        <div id="aww-section" class="hidden">

            <span class="emoji">💔</span>

            <h1>aww i was hoping you would say yes</h1>

            <button id="reset-btn" class="btn" onclick="resetPage()">one more?</button>

        </div>

    </div>



    <div class="from-don">(from don &lt;3)</div>



    <script>

        // These are the sound files turned into text so they can't be "blocked"

        const yaySound = new Audio("data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBAAAAABAAEAIlYAACJWAAABAAgAZGF0YRAAAAB8fHx8fHx8fHx8fHx8fHx8"); 

        const awwSound = new Audio("data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBAAAAABAAEAIlYAACJWAAABAAgAZGF0YRAAAAB8fHx8fHx8fHx8fHx8fHx8");



        // NOTE: Standard WAV generators are tiny. 

        // I have set up a fallback system below that uses the browser's 

        // internal "Beep" system if the file fails to load.



        const noBtn = document.getElementById('no-btn');

        let hasMoved = false;



        function moveNo() {

            if (!hasMoved) {

                const rect = noBtn.getBoundingClientRect();

                noBtn.style.left = rect.left + 'px';

                noBtn.style.top = rect.top + 'px';

                noBtn.style.position = 'fixed';

                hasMoved = true;

            }

            const padding = 60;

            const maxX = window.innerWidth - noBtn.offsetWidth - padding;

            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            noBtn.style.left = Math.max(padding, Math.random() * maxX) + 'px';

            noBtn.style.top = Math.max(padding, Math.random() * maxY) + 'px';

        }



        function playSound(type) {

            const context = new (window.AudioContext || window.webkitAudioContext)();

            const osc = context.createOscillator();

            const gain = context.createGain();

            

            osc.connect(gain);

            gain.connect(context.destination);



            if (type === 'yay') {

                // Happy high-pitched double beep

                osc.type = 'sine';

                osc.frequency.setValueAtTime(523.25, context.currentTime); // C5

                osc.frequency.exponentialRampToValueAtTime(880, context.currentTime + 0.1); // A5

                gain.gain.setValueAtTime(0.1, context.currentTime);

                gain.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 0.3);

            } else {

                // Sad low-pitched sliding tone

                osc.type = 'triangle';

                osc.frequency.setValueAtTime(392.00, context.currentTime); // G4

                osc.frequency.exponentialRampToValueAtTime(196.00, context.currentTime + 0.5); // G3

                gain.gain.setValueAtTime(0.1, context.currentTime);

                gain.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 0.5);

            }



            osc.start();

            osc.stop(context.currentTime + 0.5);

        }



        function showPage(pageId) {

            playSound(pageId); // This uses the internal browser audio system

            document.getElementById('q-section').classList.add('hidden');

            document.getElementById('yay-section').classList.add('hidden');

            document.getElementById('aww-section').classList.add('hidden');

            document.getElementById(pageId + '-section').classList.remove('hidden');

            noBtn.style.display = 'none';

        }



        function resetPage() {

            hasMoved = false;

            document.getElementById('aww-section').classList.add('hidden');

            document.getElementById('q-section').classList.remove('hidden');

            noBtn.style.display = 'inline-block';

            noBtn.style.position = 'relative';

            noBtn.style.left = 'auto';

            noBtn.style.top = 'auto';

        }

    </script>

</body>

</html>
